name: 插件检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # 固定依赖并禁用安装脚本；插件本身没有构建步骤。
      - name: 安装开发依赖
        run: npm ci --ignore-scripts
      - name: 检查清单与语法
        run: npm run check
      - name: 运行测试
        run: npm test
      - name: 验证实际分发包
        run: npm run test:package
